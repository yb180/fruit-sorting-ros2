name: ROS 2 Humble build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  humble:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy@sha256:566b87e6dfc48392189a9c32e594e84060fa9948de93b04e536f39475a1f6963
    env:
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '42'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install declared dependencies with rosdep
        run: ./scripts/install_dependencies.sh
      - name: Build, run unit tests and launch integration tests
        run: ./scripts/build_and_test.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-test-results
          path: |
            fruit_sorting_ws/build/**/test_results/**
            fruit_sorting_ws/build/**/pytest.xml
            fruit_sorting_ws/log/**
          if-no-files-found: warn
